name: Build scmod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build .github/workflows/UpgradedCopperMod/SurvivalcraftTemplateModForAPI.csproj -c Release --no-incremental

      - name: Package scmod (modinfo.json at the root)
        shell: python
        run: |
          import zipfile, pathlib, sys
          root = pathlib.Path(".github/workflows/UpgradedCopperMod")
          dlls = list(root.glob("bin/Release/**/UpgradedCopperMod.dll"))
          if not dlls:
              sys.exit("UpgradedCopperMod.dll not found")
          out = dlls[0].parent
          added = set()
          data_ext = {".csv", ".lang", ".json", ".xml", ".png", ".txt"}
          with zipfile.ZipFile("UpgradedCopperMod.scmod", "w", zipfile.ZIP_DEFLATED) as z:
              # 1) toàn bộ output build
              for p in sorted(out.rglob("*")):
                  if p.is_file() and p.suffix != ".scmod":
                      arc = p.relative_to(out).as_posix()
                      z.write(p, arc)
                      added.add(arc)
              # 2) file dữ liệu trong thư mục project (csv, lang...), bỏ bin/obj
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.suffix.lower() not in data_ext:
                      continue
                  rel = p.relative_to(root)
                  if rel.parts[0] in ("bin", "obj"):
                      continue
                  arc = rel.as_posix()
                  if arc not in added:
                      z.write(p, arc)
                      added.add(arc)
          names = zipfile.ZipFile("Giangscexpansion.scmod").namelist()
          print("\n".join(names))
          if "modinfo.json" not in names or "UpgradedCopperMod.dll" not in names:
              sys.exit("modinfo.json or dll is not at the root of the scmod")

      - name: Upload scmod
        uses: actions/upload-artifact@v4
        with:
          name: UpgradedCopperMod
          path: UpgradedCopperMod.scmod
          if-no-files-found: error
